services:
  # ============================================================================
  # 1. DATABASE SERVICE (PostgreSQL 16 + PostGIS 3.4)
  # ============================================================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: ecoroute_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecoroute_db
      POSTGRES_USER: ecoroute_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ecoroute_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoroute_user -d ecoroute_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 2. BACKEND API SERVICE (Express + PostGIS Client)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoroute_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_NAME: ${APP_NAME:-EcoRoute Engine}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ecoroute_db
      DATABASE_USER: ecoroute_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ecoroute_password}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_URL: postgresql://ecoroute_user:${DATABASE_PASSWORD:-ecoroute_password}@db:5432/ecoroute_db
      JWT_SECRET: ${JWT_SECRET:-ecoroute-production-jwt-secret-key-32-chars-long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ecoroute-production-refresh-secret-key-32-chars}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://localhost:5000}
      OSRM_TIMEOUT_MS: ${OSRM_TIMEOUT_MS:-5000}
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
      ENABLE_EXTERNAL_APIS: ${ENABLE_EXTERNAL_APIS:-false}
      ENABLE_NOTIFICATIONS: ${ENABLE_NOTIFICATIONS:-false}
      ENABLE_EMAIL: ${ENABLE_EMAIL:-false}
      ENABLE_SMS: ${ENABLE_SMS:-false}
      ENABLE_QUEUE: ${ENABLE_QUEUE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_REQUEST_LOGGING: ${ENABLE_REQUEST_LOGGING:-true}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-EcoRoute <noreply@ecoroute.local>}
      RESET_OTP_EXPIRY_MINUTES: ${RESET_OTP_EXPIRY_MINUTES:-10}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:5000/api/v1/health', r => process.exit(r.statusCode && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # 3. FRONTEND WEB APPLICATION (Next.js 16)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    container_name: ecoroute_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db_data:
